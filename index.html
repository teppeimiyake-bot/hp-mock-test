<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HP Mock Test</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f5f2; --fg:#1b1b1b; --accent:#1f4e79; --muted:#6b6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Noto Sans JP",sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:20px 24px; display:flex; justify-content:space-between; align-items:center; }
  header strong { font-size:18px; }
  nav a { margin-left:20px; color:var(--muted); text-decoration:none; font-size:14px; }
  .hero { padding:96px 24px 72px; max-width:960px; margin:0 auto; }
  .hero h1 { font-size:clamp(32px,6vw,56px); line-height:1.2; margin:0 0 20px; font-weight:700; }
  .hero p { font-size:18px; color:var(--muted); max-width:560px; margin:0 0 32px; }
  .btn { display:inline-block; background:var(--accent); color:#fff; padding:14px 28px; border-radius:6px; text-decoration:none; font-weight:700; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:20px; max-width:960px; margin:0 auto; padding:0 24px 96px; }
  .card { background:#fff; border-radius:10px; padding:28px 24px; }
  .card h2 { font-size:18px; margin:0 0 8px; }
  .card p { margin:0; color:var(--muted); font-size:14px; line-height:1.7; }
  footer { padding:24px; text-align:center; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <strong>HP Mock</strong>
  <nav><a href="#">サービス</a><a href="#">実績</a><a href="#">会社概要</a><a href="#">お問い合わせ</a></nav>
</header>
<section class="hero">
  <h1>デプロイ導線の<br>テストページ</h1>
  <p>GitHub → Vercel の自動デプロイが通っているかを確認するためのモックです。</p>
  <a class="btn" href="#">お問い合わせ</a>
</section>
<section class="grid">
  <div class="card"><h2>映像制作</h2><p>企業PR・採用・サービス紹介の映像を企画から納品まで一貫して制作。</p></div>
  <div class="card"><h2>サイネージ出稿</h2><p>大学・商業施設のサイネージ枠への出稿をワンストップで対応。</p></div>
  <div class="card"><h2>業務支援</h2><p>営業リスト作成・送付代行など、事業運営のバックオフィスを支援。</p></div>
</section>
<footer>© 2026 HP Mock Test</footer>
</body>
</html>
